services:
  backend_test:
    build:
      context: ../backend
      secrets:
        - S3_ACCESS_KEY_ID
        - S3_SECRET_ACCESS_KEY
    expose:
      - "8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend-data4trees-test.rule=Host(`test-data4trees.services.d4g.fr`) && PathRegexp(`^/(static|api|api-auth|auth|admin|token)`)
      - traefik.http.routers.backend-data4trees-test.entryPoints=webtls
      - traefik.http.routers.backend-data4trees-test.tls=true
      - traefik.docker.network=d4g-internal
      - traefik.http.services.backend-data4trees-test.loadbalancer.server.port=8000
    volumes:
      - backend_db_test:/app/db # Persist user db
      - backend_catalog:/app/catalog # Persist catalog data
    networks:
      - d4g-internal
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the deployment environment}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # adjust as needed
        max-file: "3"

  webapp_test:
    build:
      context: ../webapp
      args:
        VITE_API_URL: /api
    depends_on:
      backend_test:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.data4trees-test.rule=Host(`test-data4trees.services.d4g.fr`)
      - traefik.http.routers.data4trees-test.entryPoints=webtls
      - traefik.http.routers.data4trees-test.tls=true
      - traefik.docker.network=d4g-internal
      - traefik.http.services.data4trees-test.loadbalancer.server.port=3000
    networks:
      - d4g-internal
    healthcheck:
      test: ["CMD", "echo", "OK"] # TODO: implement healthcheck in frontend
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # adjust as needed
        max-file: "3"

networks:
  d4g-internal:
    external: true

volumes:
  backend_db_test:
    external: true
